<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<title>暗棋對戰</title>
<meta name="description" content="跟朋友線上下暗棋，不用註冊。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&text=%E5%B8%A5%E4%BB%95%E7%9B%B8%E4%BF%A5%E5%82%8C%E7%82%AE%E5%85%B5%E5%B0%87%E5%A3%AB%E8%B1%A1%E8%BB%8A%E9%A6%AC%E5%8C%85%E5%8D%92%E6%9A%97%E6%A3%8B&display=block">
<style>
  :root {
    --bg: #16120e; --bg2: #211a14; --surface: rgba(255, 244, 225, .055); --line: rgba(255, 236, 205, .12);
    --ink: #f4ead9; --muted: #a8998a; --gold: #e0ad52; --gold-soft: rgba(224, 173, 82, .18);
    --red: #b8261c; --red-glow: rgba(214, 64, 46, .55); --black: #1b1a19; --black-glow: rgba(240, 230, 210, .45);
    --ivory-1: #fffaf0; --ivory-2: #f2e3c6; --ivory-3: #d8c197; --edge: #9c7c4f;
    --wood-1: #d8a35f; --wood-2: #c48a45; --wood-3: #a8702f; --grid: rgba(78, 42, 12, .55);
    --kai: "LXGW WenKai TC", "BiauKai", "KaiTi", "STKaiti", "Kaiti TC", "Noto Serif TC", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  /* effects fly past the edges; never let them widen the page (phones would re-zoom and resize the board) */
  html, body { overflow-x: hidden; overflow-x: clip; max-width: 100%; }
  body {
    margin: 0; min-height: 100svh; color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #3a2a1a 0%, transparent 60%), radial-gradient(800px 500px at 100% 100%, #2a1d12 0%, transparent 60%), var(--bg);
  }
  main { max-width: 900px; margin: 0 auto; padding: 14px 16px 40px; }
  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background .2s, border-color .2s, transform .1s; }
  button:hover { border-color: rgba(255, 236, 205, .3); background: rgba(255, 244, 225, .09); }
  button:active { transform: scale(.96); }
  button.primary { background: linear-gradient(180deg, #e9b85c, #c98f2e); color: #2a1a06; border-color: transparent; font-weight: 700; box-shadow: 0 6px 20px rgba(224, 173, 82, .3); }
  button.icon { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; }
  button svg { width: 18px; height: 18px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .zh { font-family: var(--kai); font-size: 28px; color: var(--gold); letter-spacing: 2px; text-shadow: 0 2px 12px rgba(224, 173, 82, .35); }
  .brand .en { font-weight: 700; letter-spacing: 1.5px; font-size: 14px; text-transform: uppercase; color: var(--muted); }
  .tools { display: flex; gap: 6px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 12px; }

  /* lobby */
  #lobby { text-align: center; padding: 34px 18px; margin-top: 30px; }
  #lobby .hero { font-family: var(--kai); font-size: 64px; color: var(--gold); line-height: 1; letter-spacing: 8px; text-shadow: 0 4px 30px rgba(224, 173, 82, .35); }
  #lobby p { color: var(--muted); max-width: 440px; margin: 14px auto 22px; }
  #lobby .row { justify-content: center; }
  .hero-pieces { display: flex; justify-content: center; gap: 10px; margin: 22px 0 6px; --cell: 64px; }
  .hero-pieces .piece { width: 58px; height: 58px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* players */
  .players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; margin-top: 12px; }
  .player { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; transition: box-shadow .35s, border-color .35s, background .35s; min-width: 0; }
  .player.right { flex-direction: row-reverse; text-align: right; }
  .player .disc { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--kai); font-size: 18px; background: #5a3e26; color: rgba(255, 230, 190, .5); box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .player .disc.r { background: radial-gradient(circle at 35% 30%, var(--ivory-1), var(--ivory-2)); color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .player .disc.b { background: radial-gradient(circle at 35% 30%, var(--ivory-1), var(--ivory-2)); color: var(--black); box-shadow: inset 0 0 0 2px var(--black); }
  .player .who { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .caps { display: flex; flex-wrap: wrap; gap: 2px; min-height: 20px; }
  .player.right .caps { justify-content: flex-end; }
  .player.turn { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(224, 173, 82, .25); }
  .player.turn .who::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin: 0 6px; vertical-align: middle; box-shadow: 0 0 8px var(--gold); }
  .vs { align-self: center; font-family: var(--kai); color: var(--muted); font-size: 18px; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .mini { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-family: var(--kai); font-size: 13px; background: radial-gradient(circle at 35% 30%, var(--ivory-1), var(--ivory-2)); box-shadow: inset 0 0 0 1.5px currentColor; animation: popIn .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  .mini.r { color: var(--red); } .mini.b { color: var(--black); }
  @keyframes popIn { from { transform: scale(0); } }

  #status { text-align: center; margin-top: 10px; height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; color: var(--ink); }
  #status b { color: var(--gold); }

  .share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .conn { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #8a7b6b; }
  .conn .dot.on { background: #3ccf7a; box-shadow: 0 0 10px #3ccf7a; }
  .conn .dot.wait { background: var(--gold); }

  /* board */
  .board-wrap {
    margin: 12px auto 0; padding: 12px; border-radius: 16px; position: relative; width: fit-content; max-width: 100%;
    background:
      repeating-linear-gradient(92deg, rgba(90, 50, 15, .06) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(88deg, rgba(255, 220, 160, .07) 0 1px, transparent 1px 23px),
      linear-gradient(160deg, var(--wood-1), var(--wood-2) 55%, var(--wood-3));
    box-shadow: 0 0 0 2px #5b3a1a, 0 0 0 6px #7a5129, 0 0 0 7px #3b2410, 0 24px 60px rgba(0, 0, 0, .55), inset 0 2px 8px rgba(255, 230, 180, .35);
  }
  #board { display: grid; grid-template-columns: repeat(8, var(--cell)); --cell: 96px; position: relative; }
  #board.portrait { grid-template-columns: repeat(4, var(--cell)); }
  .cell { width: var(--cell); height: var(--cell); display: grid; place-items: center; position: relative; box-shadow: inset 0 0 0 .5px var(--grid); }
  .cell.last-to::before, .cell.last-from::before { content: ""; position: absolute; inset: 3px; border-radius: 8px; }
  .cell.last-to::before { background: rgba(255, 214, 120, .32); box-shadow: inset 0 0 0 2px rgba(255, 220, 140, .6); }
  .cell.last-from::before { box-shadow: inset 0 0 0 2px rgba(255, 220, 140, .45); border-radius: 50%; inset: 30%; }
  .cell.target { cursor: pointer; }
  .cell.target::after { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: rgba(40, 110, 70, .85); box-shadow: 0 0 0 4px rgba(60, 180, 110, .25); animation: popIn .18s ease-out both; pointer-events: none; }
  .cell.target.cap::after { width: 92%; height: 92%; background: transparent; box-shadow: 0 0 0 3px rgba(230, 60, 40, .9), 0 0 18px rgba(230, 60, 40, .6); z-index: 2; }
  @keyframes dotPulse { 50% { transform: scale(.75); opacity: .7; } }

  /* pieces */
  .piece { width: 84%; height: 84%; position: relative; transition: transform .22s cubic-bezier(.2, .8, .2, 1); user-select: none; }
  .piece .face, .piece .back { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; }
  .piece .face {
    background: radial-gradient(circle at 34% 28%, var(--ivory-1) 0%, var(--ivory-2) 55%, var(--ivory-3) 100%);
    box-shadow: 0 calc(var(--cell) * .035) 0 var(--edge), 0 calc(var(--cell) * .07) calc(var(--cell) * .1) rgba(0, 0, 0, .4),
      inset 0 0 0 calc(var(--cell) * .045) #f7ecd6, inset 0 0 0 calc(var(--cell) * .06) currentColor, inset 0 -3px 6px rgba(120, 80, 30, .25);
  }
  .piece .ch { font-family: var(--kai); font-weight: 700; font-size: calc(var(--cell) * .5); line-height: 1; transform: translateY(-3%); }
  .piece.r { color: var(--red); } .piece.b { color: var(--black); }
  .piece .back {
    background: radial-gradient(circle at 34% 28%, #a77a4f 0%, #7a5232 55%, #553620 100%);
    box-shadow: 0 calc(var(--cell) * .035) 0 #3a2413, 0 calc(var(--cell) * .07) calc(var(--cell) * .1) rgba(0, 0, 0, .45),
      inset 0 0 0 calc(var(--cell) * .045) #8a6140, inset 0 0 0 calc(var(--cell) * .06) rgba(240, 200, 140, .35), inset 0 -3px 6px rgba(0, 0, 0, .3);
  }
  .piece .back::after { content: ""; width: 62%; height: 62%; border-radius: 50%; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .35), 0 1px 0 rgba(255, 220, 170, .18); }
  .piece.down.flippable { cursor: pointer; }
  @media (hover: hover) { .piece.down.flippable:hover { transform: translateY(-4%) scale(1.05); } }
  .piece.mine { cursor: pointer; }
  @media (hover: hover) { .piece.mine:hover { transform: translateY(-4%) scale(1.04); } }
  .cell.sel .piece { transform: translateY(-9%) scale(1.1); z-index: 3; }
  .cell.sel .piece::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255, 210, 110, .95), 0 0 18px rgba(255, 200, 90, .7); }
  .ghost { position: absolute; width: 84%; height: 84%; pointer-events: none; z-index: 4; }
  .burst { position: absolute; width: 90%; height: 90%; border-radius: 50%; pointer-events: none; z-index: 5; box-shadow: 0 0 0 3px rgba(255, 200, 100, .9); animation: burst .5s ease-out forwards; }
  @keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* chat */
  #chatLog { max-height: 120px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  #chatLog:empty { display: none; }
  .msg { padding: 5px 11px; border-radius: 12px; background: rgba(255, 244, 225, .08); align-self: flex-start; max-width: 80%; word-break: break-word; }
  .msg.me { background: var(--gold-soft); align-self: flex-end; }
  #chatForm { display: flex; gap: 8px; }
  #chatInput { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  #chatInput::placeholder { color: var(--muted); }

  /* rules */
  .rules li { margin-bottom: 5px; color: #e6dccb; }
  table.ranks { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
  table.ranks td, table.ranks th { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
  table.ranks td.k { font-family: var(--kai); font-size: 20px; }

  /* overlay */
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 7, 4, .6); backdrop-filter: blur(3px); z-index: 50; animation: fade .3s both; padding: 16px; }
  #overlay .card { background: linear-gradient(180deg, #2c2219, #1e1712); border: 1px solid rgba(224, 173, 82, .5); border-radius: 20px; padding: 28px 30px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); animation: rise .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  #overlay h2 { font-family: var(--kai); font-size: 40px; margin: 0 0 6px; color: var(--gold); letter-spacing: 2px; }
  #overlay p { color: var(--muted); margin: 0 0 20px; }
  #overlay .row { justify-content: center; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  .confetti { position: fixed; top: -20px; width: 9px; height: 14px; z-index: 60; pointer-events: none; border-radius: 2px; }

  .ver { text-align: center; color: rgba(168, 153, 138, .5); font-size: 12px; margin-top: 24px; }
  /* effects (all one-shot, nothing loops) */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .shard { position: absolute; border-radius: 2px; box-shadow: 0 0 6px rgba(255, 210, 120, .6); }
  .pop { position: absolute; font-family: var(--kai); font-weight: 700; color: #fff3d6; white-space: nowrap; line-height: 1;
    text-shadow: 0 2px 0 #7a3a10, 0 0 14px rgba(255, 170, 60, .9); -webkit-text-stroke: 1px #6b2a08; }
  .pop.boom { color: #ffdf6b; }
  .banner { position: absolute; text-align: center; white-space: nowrap; padding: 10px 26px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(40, 25, 12, .94), rgba(20, 12, 6, .94)); border: 2px solid var(--gold);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6), 0 0 30px rgba(224, 173, 82, .45); }
  .banner .bt { font-family: var(--kai); font-size: clamp(28px, 7vw, 52px); color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 18px rgba(255, 190, 80, .7); }
  .banner.r .bt { color: #ff6b55; } .banner.b .bt { color: #f4ead9; }
  .banner .bs { color: var(--muted); font-size: 14px; }
  .flash { position: absolute; inset: 0; border-radius: 16px; }
  .emo { position: fixed; font-size: 42px; z-index: 80; pointer-events: none; line-height: 1; }
  .reacts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .reacts button { padding: 3px 9px; font-size: 21px; line-height: 1.25; }
  .stamp { display: inline-grid; place-items: center; width: 108px; height: 108px; border: 5px solid currentColor; border-radius: 16px; margin-bottom: 10px;
    font-family: var(--kai); font-size: 72px; line-height: 1; color: #d8402e; transform: rotate(-12deg); background: rgba(216, 64, 46, .08); text-shadow: 0 0 16px rgba(216, 64, 46, .5); }
  .stamp.lose { color: #8f8578; background: rgba(143, 133, 120, .08); text-shadow: none; }
  .stamp.draw { color: var(--gold); background: var(--gold-soft); }
  #toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #2c2219; border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: 999px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 70; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    main { padding: 10px 12px 30px; }
    .brand .zh { font-size: 24px; } .brand .en { display: none; }
    button.icon { width: 34px; height: 34px; }
    .players { gap: 6px; margin-top: 8px; }
    .player { padding: 6px 8px; gap: 7px; border-radius: 12px; }
    .player .disc { width: 26px; height: 26px; font-size: 15px; }
    .player .who { font-size: 13px; }
    .mini { width: 16px; height: 16px; font-size: 10px; }
    .vs { font-size: 14px; }
    #status { font-size: 13px; margin-top: 6px; }
    .board-wrap { padding: 7px; border-radius: 12px; margin-top: 8px; }
    .panel { margin-top: 8px; padding: 10px 12px; }
    #lobby .hero { font-size: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><span class="zh">暗棋</span></div>
    <div class="tools">
      <button class="icon" id="soundBtn" aria-label="Sound"></button>
      <button class="icon" id="rulesBtn" aria-label="Rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
    </div>
  </div>

  <!-- Lobby -->
  <section id="lobby" class="panel">
    <div class="hero">暗棋</div>
    <div class="hero-pieces" id="heroPieces"></div>
    <p data-t="intro"></p>
    <div class="row">
      <button class="primary" id="createBtn" data-t="create"></button>
      <button id="localBtn" data-t="local"></button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="panel share" id="shareRow">
      <span class="muted" data-t="share"></span>
      <input type="text" id="shareLink" readonly>
      <button class="primary" id="copyBtn" data-t="copy"></button>
    </div>

    <div class="players">
      <div class="player" id="pMe"><div class="disc"></div><div style="min-width:0"><div class="who"></div><div class="caps"></div></div></div>
      <div class="vs">vs</div>
      <div class="player right" id="pOpp"><div class="disc"></div><div style="min-width:0"><div class="who"></div><div class="caps"></div></div></div>
    </div>
    <div id="status"></div>

    <div class="board-wrap"><div id="board"></div><div id="fx"></div></div>

    <div class="row" style="justify-content:space-between;margin-top:12px">
      <span class="conn" id="conn"></span>
      <button id="newBtn" data-t="newGame"></button>
    </div>

    <div class="panel" id="chatCard">
      <div class="reacts" id="reacts"></div>
      <div id="chatLog"></div>
      <form id="chatForm">
        <input type="text" id="chatInput" maxlength="200" autocomplete="off">
        <button data-t="send"></button>
      </form>
    </div>
  </section>

  <section id="rules" class="panel hidden">
    <h3 data-t="rules" style="margin-top:0"></h3>
    <ul class="rules" id="rulesList"></ul>
    <table class="ranks" id="rankTable"></table>
  </section>
</main>
<div class="ver">版本 5</div>
<div id="overlay" class="hidden"><div class="card"><div class="stamp" id="ovStamp"></div><h2 id="ovTitle"></h2><p id="ovReason"></p><div class="row"><button class="primary" id="ovAgain" data-t="again"></button><button id="ovClose" data-t="close"></button></div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="logic.js?v=5"></script>
<script>
const APP_VER = '5';
(function checkVersion() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => (r.ok ? r.text() : '')).then(v => {
    v = v.trim();
    let tried = null; try { tried = sessionStorage.getItem('bq-upd'); } catch (_) {}
    if (!v || v === APP_VER || tried === v) return;
    try { sessionStorage.setItem('bq-upd', v); } catch (_) {}
    const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.href);
  }).catch(() => {});
})();
const B = window.Banqi;
const CH = { r: { K: '帥', A: '仕', E: '相', R: '俥', H: '傌', C: '炮', P: '兵' }, b: { K: '將', A: '士', E: '象', R: '車', H: '馬', C: '包', P: '卒' } };
const T = {
  zh: {
    rules: '規則', intro: '跟朋友線上下暗棋，不用註冊：開一局，把連結傳給對方。',
    create: '建立線上對局', local: '同一台裝置對下', newGame: '重新開局', share: '把這個連結傳給朋友：',
    copy: '複製', copied: '已複製連結', send: '送出', again: '再來一局', close: '關閉',
    chatPh: '打個招呼…', red: '紅方', black: '黑方', you: '你', friend: '朋友', p1: '玩家一', p2: '玩家二',
    yourTurn: '輪到你', theirTurn: '輪到朋友', firstFlip: '點一顆棋翻開，翻到的顏色就是你的。',

// What just happened, told with effects. Runs on both screens from the same state change.
function effects(p, s) {
  const last = s.last, mover = p.turn;
  if (last.type === 'flip') {
    streak[mover] = 0;
    const pc = s.board[last.i];
    setTimeout(() => {
      shards(last.i, pc.c === 'r' ? ['#ffd27a', '#ff6b55'] : ['#ffd27a', '#f4ead9'], 10);
      sfx.sparkle();
      if (pc.t === 'K') { banner(`${CH[pc.c].K} 現身！`, '', pc.c); flash('rgba(255,200,90,.6)'); shake(4); sfx.gong(); }
      else if (!p.colors && s.colors) {
        const who = mode === 'local' ? (mover === 'host' ? t('p1') : t('p2')) : t('you');
        const col = s.colors[mode === 'local' ? mover : mode];
        banner(`${who}執${colName(col)}`, mode === 'local' ? '' : `${t('friend')}是${colName(col === 'r' ? 'b' : 'r')}`, col);
      }
    }, 260);
    return;
  }

  const n = ++streak[mover], victim = p.board[last.to], att = s.board[last.to], cannon = att.t === 'C';
  setTimeout(() => {
    shards(last.to, ['#f7ecd6', victim.c === 'r' ? '#d9402e' : '#2a2725', '#e0ad52'], 16);
    let big = false;
    if (att.t === 'P' && victim.t === 'K') { banner('小兵立大功！', `${CH[att.c].P}吃${CH[victim.c].K}`, att.c); shake(10); flash('rgba(255,210,110,.7)'); sfx.gong(.05); big = true; }
    else if (victim.t === 'K') { banner('斬將！', `${CH[att.c][att.t]}吃${CH[victim.c].K}`, att.c); shake(10); flash('rgba(230,70,50,.55)'); sfx.gong(.05); big = true; }
    else if (cannon) { popText(last.to, '砰！', 'boom'); shake(7); sfx.boom(); }
    else { popText(last.to, victim.t === 'R' || victim.t === 'A' ? '吃大子！' : '吃！'); if ('RAE'.includes(victim.t)) shake(4); }

    const disc = el.querySelector('.disc');
    disc.className = 'disc ' + (col || '');
    disc.textContent = col ? CH[col].K : '?';
    el.querySelector('.who').textContent = name + (col ? ' · ' + colName(col) : '');

  } else if (mode === 'local') {
    s = state.colors ? `<b>${t('turnOf')(colName(state.colors[state.turn]))}</b>` : t('firstLocal');
  } else {
    const mine = state.turn === mode, sep = lang === 'zh' ? '，' : ': ';
    if (!state.colors) s = mine ? `<b>${t('yourTurn')}</b>${sep}${t('firstFlip')}` : `<b>${t('theirTurn')}</b>${sep}${t('waitFirst')}`;
    else s = mine ? `<b>${t('yourTurn')}</b>${sep}${t('hint')}` : t('theirTurn');
  }
  if ($('status').innerHTML !== s) $('status').innerHTML = s;
}

function showOver() {
  if (!state.winner) return;
  let title;
  if (state.winner === 'draw') title = t('draw');
  else if (mode === 'local') title = t('winOf')(colName(state.colors[state.winner]));
  else title = state.winner === mode ? t('win') : t('lose');
  $('ovTitle').textContent = title;
  $('ovReason').textContent = t('reason')[state.reason];
  $('overlay').classList.remove('hidden');
  const won = state.winner !== 'draw' && (mode === 'local' || state.winner === mode);
  const st = $('ovStamp');
  st.textContent = state.winner === 'draw' ? '和' : won ? '勝' : '敗';
  st.className = 'stamp' + (state.winner === 'draw' ? ' draw' : won ? '' : ' lose');
  st.animate([{ transform: 'rotate(-12deg) scale(3)', opacity: 0 }, { transform: 'rotate(-12deg) scale(.92)', opacity: 1, offset: .7 }, { transform: 'rotate(-12deg) scale(1)', opacity: 1 }],
    { duration: 420, delay: 250, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'backwards' });
  setTimeout(sfx.stamp, 550);
  if (won) { setTimeout(sfx.fanfare, 750); confetti(); }
  else if (state.winner !== 'draw') setTimeout(sfx.sad, 750);
}
function confetti() {
  if (reduced) return;
  const colors = ['#e0ad52', '#d9402e', '#f4ead9', '#3ccf7a', '#f6c95b'];
  for (let k = 0; k < 70; k++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[k % colors.length];
    document.body.appendChild(c);
    const drift = (Math.random() - .5) * 200, rot = Math.random() * 720;
    c.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${drift}px, ${innerHeight + 40}px) rotate(${rot}deg)` }],
      { duration: 1800 + Math.random() * 1600, delay: Math.random() * 400, easing: 'cubic-bezier(.3,.6,.5,1)' }).onfinish = () => c.remove();
  }
}
$('ovClose').onclick = () => $('overlay').classList.add('hidden');
$('ovAgain').onclick = () => { $('overlay').classList.add('hidden'); newGame(true); };

// ---------- input ----------
$('board').addEventListener('click', e => {
  ac();
  const cell = e.target.closest('.cell');
  if (!cell || !state || state.winner) return;
  const i = +cell.dataset.i, p = state.board[i], role = me();
  if (state.turn !== role) { toast(t('notTurn')); return; }
  const myCol = state.colors && state.colors[role];
  if (sel != null && B.targets(state.board, sel).includes(i)) { act({ type: 'move', from: sel, to: i }); return; }
  if (p && !p.up) { act({ type: 'flip', i }); return; }
  if (p && p.up && p.c === myCol) { sel = sel === i ? null : i; knock(2600, .03, .15); render(false); return; }
  sel = null; render(false);
});

function act(action) {
  sel = null;
  if (mode === 'guest') { send({ type: 'action', action }); return; }
  const role = mode === 'local' ? state.turn : 'host';
  const r = B.apply(state, role, action);
  if (!r.ok) { toast(r.err); render(false); return; }
  setState(r.state);
}

function setState(s, animate = true) {
  if (mode === 'host') s.seq = ((state && state.seq) || 0) + 1;
  state = s;
  if (mode !== 'guest') store.set(storeKey(), JSON.stringify(state));
  render(animate);
  if (mode === 'host') send({ type: 'state', state });
}
const storeKey = () => (mode === 'local' ? 'bq-local' : 'bq-room-' + room);

function newGame(skipConfirm) {
  if (!skipConfirm && state && state.moveNo > 0 && !state.winner && !confirm(t('confirmNew'))) return;
  if (mode === 'guest') { send({ type: 'reset' }); return; }
  resetGame();
}
$('newBtn').onclick = () => newGame(false);
function resetGame() {
  const first = state ? B.other(state.first) : 'host';
  sel = null;
  $('overlay').classList.add('hidden');
  setState(B.newGame(first));
}

// ---------- emoji reactions ----------
const EMOJI = ['👍', '😂', '😱', '🔥', '😭', '🙏', '😎', '🤯'];
$('reacts').innerHTML = EMOJI.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
let lastReact = 0;
$('reacts').onclick = e => {
  const b = e.target.closest('button'); if (!b || Date.now() - lastReact < 350) return;
  lastReact = Date.now();
  send({ type: 'react', e: b.dataset.e });
  floatEmoji(b.dataset.e, true);
};
function floatEmoji(e, mine) {
  if (!EMOJI.includes(e)) return;
  sfx.bloop();
  for (let k = 0; k < 3; k++) {
    const d = document.createElement('div');
    d.className = 'emo'; d.textContent = e;
    d.style.left = (mine ? 55 + Math.random() * 30 : 15 + Math.random() * 30) + 'vw';
    d.style.bottom = '80px';
    document.body.appendChild(d);
    const sway = (Math.random() - .5) * 80;
    d.animate([{ transform: 'translate(0,0) scale(.5)', opacity: 0 }, { transform: `translate(${sway / 2}px,-15vh) scale(1.3)`, opacity: 1, offset: .2 },
      { transform: `translate(${sway}px,-55vh) scale(1)`, opacity: 0 }], { duration: 1800 + k * 250, delay: k * 140, easing: 'ease-out', fill: 'backwards' }).onfinish = () => d.remove();
  }
}

// ---------- chat ----------
function addChat(who, text) {
  const d = document.createElement('div');
  d.className = 'msg' + (who === 'me' ? ' me' : '');
  d.textContent = text;
  $('chatLog').appendChild(d); $('chatLog').scrollTop = 1e9;
  if (who !== 'me') { toast('💬 ' + text, 3500); knock(3000, .03, .2); knock(3400, .03, .2, .08); }
}
$('chatForm').onsubmit = e => {
  e.preventDefault();
  const v = $('chatInput').value.trim(); if (!v) return;
  if (!online()) { toast(t('waiting')); return; }
  send({ type: 'chat', text: v }); addChat('me', v); $('chatInput').value = '';
};

// ---------- networking ----------
// Every message goes out on two channels at once and the receiver drops duplicates:
//  1. PeerJS (WebRTC, direct peer to peer, fastest)
//  2. A public MQTT broker over WSS (relay; works even when the two networks block a direct connection)
// The host keeps the authoritative game state; the guest sends actions and receives full states.
const PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] } };
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const qs = new URLSearchParams(location.search), onlyRelay = qs.has('relay'), onlyP2P = qs.has('p2p'); // test switches
const hostId = () => 'banqi-tw-' + room;
const topic = who => `banqi-tw/v1/${room}/${who}`;
const seen = new Set();
let mq = null, lastHeard = 0, heard = { p2p: 0, relay: 0 }, gotState = false, startedAt = Date.now(), timers = [];
const rid = () => Math.random().toString(36).slice(2, 12);
const online = () => Date.now() - lastHeard < 12000;

function send(msg) {
  msg.id = rid();
  if (conn && conn.open) { try { conn.send(msg); } catch (_) {} }
  if (mq && mq.connected) mq.publish(topic(mode === 'host' ? 'guest' : 'host'), JSON.stringify(msg), { qos: 1 });
}
function setConn(text, kind) {
  if (setConn.v === text + kind) return;
  setConn.v = text + kind;
  $('conn').innerHTML = `<span class="dot ${kind || ''}"></span>${text}`;
  $('shareRow').classList.toggle('hidden', mode !== 'host' || kind === 'on');
}
function updateConn() {
  if (mode === 'local' || !mode) return;
  const now = Date.now(), via = now - heard.p2p < 12000 ? '（直連）' : now - heard.relay < 12000 ? '（中繼）' : '';
  if (online()) setConn(t('connected') + via, 'on');
  else if (mode === 'host') setConn(t('waiting'), 'wait');
  else if (gotState) setConn(t('disconnected'), 'wait');
  else setConn(now - startedAt > 10000 ? t('hostLeft') : t('connecting'), 'wait');
}

function receive(m, ch) {
  if (ch) heard[ch] = Date.now();
  if (!m || typeof m !== 'object' || !m.id || seen.has(m.id)) return;
  seen.add(m.id);
  const wasOnline = online();
  lastHeard = Date.now();
  if (!wasOnline) updateConn();
  if (mode === 'host') {
    if (m.type === 'hello') send({ type: 'state', state });
    else if (m.type === 'action') {
      const r = B.apply(state, 'guest', m.action);
      if (r.ok) setState(r.state); else send({ type: 'state', state });
    } else if (m.type === 'reset') resetGame();
    else if (m.type === 'chat') addChat('friend', String(m.text).slice(0, 200));
    else if (m.type === 'react') floatEmoji(m.e, false);
  } else {
    if (m.type === 'state') {
      const s = m.state;
      if (state && (s.seq || 0) <= (state.seq || 0)) return; // older or same state arriving on the slower channel
      const first = !state;
      state = s; gotState = true;
      if (sel != null && !(state.board[sel] && state.board[sel].up && state.turn === 'guest')) sel = null;
      if (first) prev = null;
      if (state.moveNo === 0) $('overlay').classList.add('hidden');
      render(!first);
    } else if (m.type === 'chat') addChat('friend', String(m.text).slice(0, 200));
    else if (m.type === 'react') floatEmoji(m.e, false);
  }
}

// --- channel 2: MQTT relay ---
function startRelay(k = 0) {
  if (onlyP2P || typeof mqtt === 'undefined') return;
  const url = BROKERS[k % BROKERS.length];
  const c = mqtt.connect(url, { clientId: 'bq-' + rid(), clean: true, connectTimeout: 7000, reconnectPeriod: 0, keepalive: 30 });
  let ok = false;
  c.on('connect', () => {
    ok = true; mq = c;
    c.subscribe(topic(mode), { qos: 1 });
    if (mode === 'guest') send({ type: 'hello' });
  });
  c.on('message', (_, payload) => { try { receive(JSON.parse(payload.toString()), 'relay'); } catch (_) {} });
  const retry = () => { if (mq === c) mq = null; c.end(true); setTimeout(() => startRelay(ok ? k : k + 1), ok ? 1500 : 500); };
  c.on('close', () => { if (!c._retried) { c._retried = true; retry(); } });
  c.on('error', () => {});
}

// --- channel 1: PeerJS direct ---
function startP2P() {
  if (onlyRelay || typeof Peer === 'undefined') return;
  if (mode === 'host') {
    peer = new Peer(hostId(), PEER_OPTS);
    peer.on('connection', c => {
      c.on('open', () => { conn = c; send({ type: 'state', state }); });
      c.on('data', m => receive(m, 'p2p'));
      c.on('close', () => { if (conn === c) conn = null; });
    });
    peer.on('error', err => { if (err.type === 'unavailable-id') { peer.destroy(); setTimeout(startP2P, 4000); } }); // old tab still holds the id after a reload
  } else {
    peer = new Peer('banqi-g-' + rid(), PEER_OPTS);
    peer.on('open', connectToHost);
    peer.on('error', err => { if (err.type === 'peer-unavailable') scheduleRetry(); });
  }
  peer.on('disconnected', () => setTimeout(() => { if (!peer.destroyed) peer.reconnect(); }, 2000));
}
function connectToHost() {
  const c = peer.connect(hostId(), { reliable: true });
  c.on('open', () => { conn = c; send({ type: 'hello' }); });
  c.on('data', m => receive(m, 'p2p'));
  c.on('close', () => { if (conn === c) conn = null; scheduleRetry(); });
}
function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(() => { if (peer && !peer.destroyed && peer.open && !(conn && conn.open)) connectToHost(); }, 5000); }

function startNet() {
  startP2P();
  startRelay();
  updateConn();
  timers.push(setInterval(() => {
    send({ type: 'ping' });
    if (mode === 'guest' && !gotState) send({ type: 'hello' });
  }, 4000));
  timers.push(setInterval(updateConn, 2000));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state) document.title = '暗棋對戰'; });

// ---------- startup ----------
function enterGame() {
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  $('shareRow').classList.toggle('hidden', mode !== 'host');
  $('chatCard').classList.toggle('hidden', mode === 'local');
  $('conn').classList.toggle('hidden', mode === 'local');
  if (mode === 'host') $('shareLink').value = location.origin + location.pathname + '?room=' + room;
}
function loadOrNew() {
  try { state = JSON.parse(store.get(storeKey())); } catch (_) { state = null; }
  if (!state || !state.board) state = B.newGame('host');
  store.set(storeKey(), JSON.stringify(state));
}

$('createBtn').onclick = () => {
  ac();
  room = Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', '?room=' + room + '&host=' + Math.random().toString(36).slice(2, 10));
  boot();
};
$('localBtn').onclick = () => { ac(); history.replaceState(null, '', '?local=1'); boot(); };
$('copyBtn').onclick = () => {
  const v = $('shareLink').value;
  if (navigator.share && matchMedia('(pointer: coarse)').matches) { navigator.share({ title: '來下暗棋', url: v }).catch(() => {}); return; }
  $('shareLink').select();
  (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast(t('copied')), () => { document.execCommand('copy'); toast(t('copied')); });
};
$('rulesBtn').onclick = () => { const r = $('rules'); r.classList.toggle('hidden'); if (!r.classList.contains('hidden')) r.scrollIntoView({ behavior: 'smooth' }); };

function boot() {
  const q = new URLSearchParams(location.search);
  room = q.get('room');
  if (q.get('local')) { mode = 'local'; loadOrNew(); }
  else if (room && q.get('host')) { mode = 'host'; loadOrNew(); }
  else if (room) { mode = 'guest'; state = null; }
  else return;
  enterGame();
  if (mode !== 'local') startNet();
  if (mode === 'guest') $('status').textContent = t('connecting');
  else { prev = null; render(false); if (state.moveNo === 0 && !reduced) deal(); }
}
$('heroPieces').append(...[{ t: 'K', c: 'r', up: true }, { t: 'C', c: 'b', up: true }, { t: 'P', c: 'r', up: false }, { t: 'H', c: 'b', up: true }].map(pieceEl));
if (!reduced) dealIn($('heroPieces').querySelectorAll('.piece'), 90);
soundIcon();
applyLang();
boot();
</script>
